<!DOCTYPE html>
<html>

<head>
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <h1>My To-Do List</h1>

    <div class="input-section">
        <input type="text" id="task" placeholder="Enter your task">
        <input type="date" id="date">

        <div class="time-section">
            <input type="number" id="hour" placeholder="HH" min="0" max="23">
            <input type="number" id="minute" placeholder="MM" min="0" max="59">
            <input type="number" id="second" placeholder="SS" min="0" max="59">
        </div>

        <select id="priority">
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
        </select>

        <button onclick="addTask()">Add Task</button>
    </div>

    <div class="task-info">
        <p>Total: <span id="taskCount">0</span> | Completed: <span id="completedCount">0</span> | Pending: <span id="pendingCount">0</span></p>
    </div>

    <ul id="taskList"></ul>

    <button onclick="clearTasks()" class="clear-btn">Clear All</button>
</div>

<script src="script.js"></script>
</body>
</html>
